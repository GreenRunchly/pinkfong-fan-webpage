    <!-- Critical loader styles are inline so the loading screen can paint immediately. -->
    <style id="critical-loader-style">
      html, body { margin: 0; min-height: 100%; }
      body.app-loading { overflow: hidden; }
      body.app-loading .world { opacity: 0; visibility: hidden; }
      body.app-ready .world { opacity: 1; visibility: visible; }

      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(255,255,255,.28), transparent 28%),
          linear-gradient(135deg, #8e78ff 0%, #d79bea 52%, #f4b7dc 100%);
        font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity .32s ease, visibility .32s ease;
      }
      #site-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .site-loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform: translateY(-1vh);
      }
      .site-loader-brand {
        color: #fff;
        font-size: clamp(28px, 7vw, 52px);
        font-weight: 900;
        letter-spacing: -2.2px;
        text-shadow: 0 7px 24px rgba(78, 42, 121, .18);
      }
      .site-loader-brand span { color: #643d91; }
      .site-loader-dots {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 12px;
      }
      .site-loader-dots i {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,.9);
        animation: pf-loader-bounce .85s ease-in-out infinite alternate;
      }
      .site-loader-dots i:nth-child(2) { animation-delay: .12s; }
      .site-loader-dots i:nth-child(3) { animation-delay: .24s; }
      @keyframes pf-loader-bounce {
        from { transform: translateY(2px) scale(.78); opacity: .55; }
        to { transform: translateY(-4px) scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .site-loader-dots i { animation: none; }
      }
    </style>

    <script>
      (() => {
        const started = performance.now();
        const ready = { css: false, hero: false, app: false };
        let finished = false;

        function finishLoader() {
          if (finished) return;
          if (!document.body) {
            document.addEventListener("DOMContentLoaded", finishLoader, { once: true });
            return;
          }

          finished = true;
          const loader = document.getElementById("site-loader");
          document.body.classList.remove("app-loading");
          document.body.classList.add("app-ready");

          if (loader) {
            loader.classList.add("is-leaving");
            window.setTimeout(() => loader.remove(), 380);
          }
        }

        window.__pinkfongAssetReady = (key) => {
          if (key in ready) ready[key] = true;
          if (ready.css && ready.hero && ready.app) {
            const minimum = Math.max(0, 320 - (performance.now() - started));
            window.setTimeout(finishLoader, minimum);
          }
        };

        // Never leave the visitor trapped behind a loader if a resource fails.
        window.setTimeout(finishLoader, 3500);
      })();
    </script>
