        <style id="critical-loader-style">
            /* Inline on purpose: prevents a white flash before the main CSS arrives. */
            html {
                min-height: 100%;
                margin: 0;
                background:
                    radial-gradient(ellipse at 76% 17%, #ffc6ec 0, transparent 51%),
                    radial-gradient(ellipse at 15% 93%, #958bff 0, transparent 60%),
                    linear-gradient(120deg, #b38af3, #e5a8e8);
                color-scheme: light;
            }

            body {
                min-height: 100%;
                margin: 0;
                background: transparent;
            }

            body.app-loading {
                overflow: hidden;
            }
            body.app-loading .world {
                opacity: 0;
                visibility: hidden;
            }
            body.app-ready .world {
                opacity: 1;
                visibility: visible;
            }
            .world {
                transition: opacity .62s cubic-bezier(.22,.61,.36,1);
            }

            #site-loader {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(ellipse at 76% 17%, #ffc6ec 0, transparent 51%),
                    radial-gradient(ellipse at 15% 93%, #958bff 0, transparent 60%),
                    linear-gradient(120deg, #b38af3, #e5a8e8);
                opacity: 1;
                visibility: visible;
                transition: opacity .62s cubic-bezier(.22,.61,.36,1), visibility .62s linear;
            }

            #site-loader.is-leaving {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .site-loader-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                transform: translateY(-1vh);
            }

            .site-loader-peek-wrap {
                width: clamp(210px, 27vw, 280px);
                filter: drop-shadow(0 18px 24px rgba(93,42,121,.18));
            }

            .site-loader-peek,
            .site-loader-peek img {
                display: block;
                width: 100%;
            }

            .site-loader-peek img {
                height: auto;
            }

            .site-loader-dots {
                display: flex;
                gap: 7px;
                align-items: center;
                justify-content: center;
                height: 12px;
            }

            .site-loader-dots i {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #643d91;
                animation: pf-loader-bounce .85s ease-in-out infinite alternate;
            }

            .site-loader-dots i:nth-child(2) {
                animation-delay: .12s;
            }
            .site-loader-dots i:nth-child(3) {
                animation-delay: .24s;
            }

            @keyframes pf-loader-bounce {
                from {
                    transform: translateY(2px) scale(.78);
                    opacity: .55;
                }
                to {
                    transform: translateY(-4px) scale(1);
                    opacity: 1;
                }
            }

            @media (max-width: 1024px) {
                .site-loader-peek-wrap {
                    width: clamp(190px, 31vw, 245px);
                }
            }

            @media (max-width: 640px) {
                .site-loader-peek-wrap {
                    width: clamp(165px, 44vw, 215px);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .site-loader-dots i {
                    animation: none;
                }
            }
        </style>
        <script>
            (() => {
                // Use the same loader timing for every visitor.
                // Once critical resources are ready, keep the loader for 1 second,
                // then fade it out smoothly.
                const EXIT_HOLD_MS = 1000;
                const EXIT_TRANSITION_MS = 620;
                const FAILSAFE_MS = 7000;

                const ready = { css: false, hero: false, app: false, locale: false };
                let finished = false;
                let exitScheduled = false;

                function finishLoader() {
                    if (finished) return;
                    if (!document.body) {
                        document.addEventListener("DOMContentLoaded", finishLoader, { once: true });
                        return;
                    }

                    finished = true;
                    const loader = document.getElementById("site-loader");
                    document.body.classList.remove("app-loading");
                    document.body.classList.add("app-ready");

                    if (loader) {
                        loader.classList.add("is-leaving");
                        window.setTimeout(() => loader.remove(), EXIT_TRANSITION_MS + 40);
                    }
                }

                function scheduleExit() {
                    if (exitScheduled || finished) return;
                    exitScheduled = true;
                    window.setTimeout(finishLoader, EXIT_HOLD_MS);
                }

                window.__pinkfongAssetReady = (key) => {
                    if (key in ready) ready[key] = true;
                    if (ready.css && ready.hero && ready.app && ready.locale) {
                        scheduleExit();
                    }
                };

                // Never leave the page trapped behind the loader.
                window.setTimeout(finishLoader, FAILSAFE_MS);
            })();
        </script>

        <script>
            (() => {
                const supported = new Set(["id", "en", "ko", "ja", "zh"]);
                let language = "id";

                try {
                    const saved = localStorage.getItem("pinkfong-language-choice");
                    if (supported.has(saved)) {
                        language = saved;
                    } else {
                        const browserLanguage = String(navigator.language || "id")
                            .toLowerCase()
                            .split(/[-_]/)[0];

                        if (supported.has(browserLanguage)) {
                            language = browserLanguage;
                        }
                    }
                } catch (_) {
                    // Local storage can be unavailable in strict/private browsing.
                }

                window.PINKFONG_PAGE_LANG = language;
                window.__pinkfongAssetReady?.("locale");
            })();
        </script>
